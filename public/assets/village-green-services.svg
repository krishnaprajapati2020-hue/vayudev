<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="vg2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F7F5"/>
    </linearGradient>
    <filter id="vg2-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F2D24" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#vg2-bg)"/>

  <!-- Header Header -->
  <g transform="translate(60, 50)">
    <text x="0" y="0" fill="#2D6A4F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="2">
      COMPREHENSIVE DENTAL SERVICES &amp; CARE
    </text>
    <text x="0" y="42" fill="#1B4D3E" font-family="-apple-system, BlinkMacSystemFont, 'Georgia', serif" font-size="36" font-weight="800">
      Village Green Dental Clinical Excellence
    </text>
    <text x="0" y="72" fill="#52796F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">
      Engineered with custom ACF Pro post types, real-time appointment booking, and mobile-first responsive styling.
    </text>
  </g>

  <!-- 4 Service Grid Cards -->
  <g transform="translate(60, 160)">
    <!-- Card 1 -->
    <rect width="255" height="360" rx="20" fill="#FFFFFF" stroke="#D1E7DD" stroke-width="1.5" filter="url(#vg2-shadow)"/>
    <rect x="20" y="20" width="60" height="60" rx="14" fill="#E8F5E9"/>
    <text x="50" y="58" text-anchor="middle" font-size="28">✨</text>
    <text x="20" y="125" fill="#1B4D3E" font-family="-apple-system, BlinkMacSystemFont, 'Georgia', serif" font-size="20" font-weight="700">Cosmetic</text>
    <text x="20" y="148" fill="#1B4D3E" font-family="-apple-system, BlinkMacSystemFont, 'Georgia', serif" font-size="20" font-weight="700">Dentistry</text>
    <text x="20" y="185" fill="#4B6358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" line-height="1.5">
      Porcelain veneers, Invisalign clear aligners, and professional whitening for flawless, radiant smile makeovers.
    </text>
    <rect x="20" y="295" width="130" height="34" rx="17" fill="#EAF5EF"/>
    <text x="85" y="316" text-anchor="middle" fill="#2D6A4F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">Learn More →</text>

    <!-- Card 2 -->
    <g transform="translate(275, 0)">
      <rect width="255" height="360" rx="20" fill="#FFFFFF" stroke="#D1E7DD" stroke-width="1.5" filter="url(#vg2-shadow)"/>
      <rect x="20" y="20" width="60" height="60" rx="14" fill="#E8F5E9"/>
      <text x="50" y="58" text-anchor="middle" font-size="28">🦷</text>
      <text x="20" y="125" fill="#1B4D3E" font-family="-apple-system, BlinkMacSystemFont, 'Georgia', serif" font-size="20" font-weight="700">Restorative</text>
      <text x="20" y="148" fill="#1B4D3E" font-family="-apple-system, BlinkMacSystemFont, 'Georgia', serif" font-size="20" font-weight="700">Implants</text>
      <text x="20" y="185" fill="#4B6358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">
        Permanent tooth replacement with precision dental implants, durable crowns, bridges, and full mouth rehabilitation.
      </text>
      <rect x="20" y="295" width="130" height="34" rx="17" fill="#EAF5EF"/>
      <text x="85" y="316" text-anchor="middle" fill="#2D6A4F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">Learn More →</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(550, 0)">
      <rect width="255" height="360" rx="20" fill="#FFFFFF" stroke="#D1E7DD" stroke-width="1.5" filter="url(#vg2-shadow)"/>
      <rect x="20" y="20" width="60" height="60" rx="14" fill="#E8F5E9"/>
      <text x="50" y="58" text-anchor="middle" font-size="28">🛡️</text>
      <text x="20" y="125" fill="#1B4D3E" font-family="-apple-system, BlinkMacSystemFont, 'Georgia', serif" font-size="20" font-weight="700">Preventive</text>
      <text x="20" y="148" fill="#1B4D3E" font-family="-apple-system, BlinkMacSystemFont, 'Georgia', serif" font-size="20" font-weight="700">Hygiene Care</text>
      <text x="20" y="185" fill="#4B6358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">
        Thorough dental exams, gentle cleanings, digital 3D scans, and periodontal health maintenance for all ages.
      </text>
      <rect x="20" y="295" width="130" height="34" rx="17" fill="#EAF5EF"/>
      <text x="85" y="316" text-anchor="middle" fill="#2D6A4F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">Learn More →</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(825, 0)">
      <rect width="255" height="360" rx="20" fill="#FFFFFF" stroke="#D1E7DD" stroke-width="1.5" filter="url(#vg2-shadow)"/>
      <rect x="20" y="20" width="60" height="60" rx="14" fill="#FEF3C7"/>
      <text x="50" y="58" text-anchor="middle" font-size="28">⚡</text>
      <text x="20" y="125" fill="#1B4D3E" font-family="-apple-system, BlinkMacSystemFont, 'Georgia', serif" font-size="20" font-weight="700">Lifetime Smile</text>
      <text x="20" y="148" fill="#1B4D3E" font-family="-apple-system, BlinkMacSystemFont, 'Georgia', serif" font-size="20" font-weight="700">Protection</text>
      <text x="20" y="185" fill="#4B6358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">
        Our exclusive patient warranty program providing peace of mind, long-term dental security, and maintenance.
      </text>
      <rect x="20" y="295" width="130" height="34" rx="17" fill="#FEF3C7"/>
      <text x="85" y="316" text-anchor="middle" fill="#B45309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">View Program →</text>
    </g>
  </g>

  <!-- Bottom QA / Code Quality Spec -->
  <g transform="translate(60, 560)">
    <rect width="1080" height="130" rx="18" fill="#F0F5F2" stroke="#D1E7DD" stroke-width="1.5"/>
    <g transform="translate(30, 30)">
      <text x="0" y="16" fill="#1B4D3E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="800">
        Quality Assurance &amp; Frontend Standards Applied
      </text>
      <text x="0" y="44" fill="#52796F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">
        Tested across Chrome, Safari, Firefox, iOS Mobile, and Android devices • Strict ZiFlow Defect Elimination Protocol
      </text>
      <text x="0" y="68" fill="#2D6A4F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">
        Engineered by Krishna Prajapat • QA Lead &amp; Senior WordPress Developer
      </text>
    </g>
    <g transform="translate(870, 35)">
      <rect width="170" height="56" rx="12" fill="#1B4D3E"/>
      <text x="85" y="24" text-anchor="middle" fill="#A7D7C5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700">WP ENGINE LIVE</text>
      <text x="85" y="43" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">villagegreennb</text>
    </g>
  </g>
</svg>
