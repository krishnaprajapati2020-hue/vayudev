<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="vg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7FAF8"/>
      <stop offset="100%" stop-color="#EAF2ED"/>
    </linearGradient>
    <linearGradient id="vg-primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B4D3E"/>
      <stop offset="100%" stop-color="#2D6A4F"/>
    </linearGradient>
    <linearGradient id="vg-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F2D24" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="750" fill="url(#vg-bg)"/>

  <!-- Top Announcement Bar -->
  <rect width="1200" height="38" fill="#1B4D3E"/>
  <text x="50" y="24" fill="#D1E7DD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
    📍 2853 E New York St, Aurora, IL 60502 • Serving Aurora &amp; Naperville Area Since 1983
  </text>
  <text x="1150" y="24" text-anchor="end" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
    📞 (630) 851-0710 &nbsp;|&nbsp; 🕒 Mon–Sat Open
  </text>

  <!-- Navigation Bar -->
  <rect y="38" width="1200" height="74" fill="#FFFFFF" filter="url(#shadow)"/>
  
  <!-- Logo Section -->
  <g transform="translate(50, 52)">
    <!-- Tooth + Leaf Icon -->
    <path d="M18 4 C10 4 4 10 4 18 C4 26 8 36 14 44 C16 46 20 46 22 44 C26 40 28 34 28 28 C34 28 42 22 42 15 C42 8 34 4 26 4 C24 4 20 4 18 4 Z" fill="#2D6A4F"/>
    <path d="M14 20 C18 14 26 12 32 16" stroke="#A7D7C5" stroke-width="3" stroke-linecap="round" fill="none"/>
    <text x="52" y="26" fill="#1B4D3E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', serif" font-size="20" font-weight="800" letter-spacing="0.5">VILLAGE GREEN</text>
    <text x="52" y="42" fill="#52796F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="2">DENTAL CENTER</text>
  </g>

  <!-- Nav Links -->
  <g transform="translate(430, 80)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#2F3E46">
    <text x="0" y="0" fill="#1B4D3E">Home</text>
    <line x1="0" y1="6" x2="38" y2="6" stroke="#2D6A4F" stroke-width="2"/>
    <text x="75" y="0">About Us</text>
    <text x="175" y="0">Dental Services ▾</text>
    <text x="325" y="0">Smile Gallery</text>
    <text x="445" y="0">Patient Reviews</text>
  </g>

  <!-- CTA Book Button -->
  <g transform="translate(1010, 55)">
    <rect width="140" height="40" rx="20" fill="url(#vg-primary)"/>
    <text x="70" y="25" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">BOOK ONLINE</text>
  </g>

  <!-- HERO SECTION -->
  <!-- Left Column: Copy & Value Proposition -->
  <g transform="translate(60, 160)">
    <!-- Badge -->
    <rect width="250" height="28" rx="14" fill="#D8F3DC"/>
    <circle cx="16" cy="14" r="5" fill="#2D6A4F"/>
    <text x="30" y="19" fill="#1B4D3E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">
