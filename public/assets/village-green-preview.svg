    </text>
    <text x="0" y="192" fill="#4B6358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="400">
      Featuring our signature Lifetime Smile Protection Warranty and state-of-the-art care.
    </text>

    <!-- Action Buttons -->
    <g transform="translate(0, 225)">
