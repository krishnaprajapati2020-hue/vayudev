      <path d="M22 18 C16 18 12 23 12 29 C12 37 16 44 22 50 C24 52 27 52 29 50 C33 46 35 41 35 36 C40 36 46 32 46 26 C46 21 40 18 34 18 C32 18 29 18 27 18 Z" fill="#2D6A4F"/>
      <path d="M19 30 C22 25 28 23 33 26" stroke="#74C69D" stroke-width="2.5" stroke-linecap="round" fill="none"/>
