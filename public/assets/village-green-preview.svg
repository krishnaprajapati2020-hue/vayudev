    <!-- Floating Badge on Card -->
    <g transform="translate(30, 210)">
      <rect width="180" height="52" rx="12" fill="#FFFFFF" stroke="#D1E7DD" stroke-width="1" filter="url(#shadow)"/>
      <circle cx="26" cy="26" r="14" fill="#D8F3DC"/>
      <text x="26" y="31" text-anchor="middle" font-size="13">⚡</text>
      <text x="48" y="22" fill="#1B4D3E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">98/100 Core Web Vitals</text>
      <text x="48" y="37" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">Sub-second LCP Speed</text>
    </g>

    <!-- Lower Service Highlights -->
    <g transform="translate(24, 275)">
      <rect width="126" height="64" rx="12" fill="#F8FAF9" stroke="#E5E7EB"/>
      <text x="63" y="26" text-anchor="middle" font-size="16">✨</text>
      <text x="63" y="44" text-anchor="middle" fill="#1F2937" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">Cosmetic Care</text>
      <text x="63" y="56" text-anchor="middle" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9">Invisalign &amp; Veneers</text>

      <g transform="translate(136, 0)">
        <rect width="126" height="64" rx="12" fill="#F8FAF9" stroke="#E5E7EB"/>
        <text x="63" y="26" text-anchor="middle" font-size="16">🦷</text>
        <text x="63" y="44" text-anchor="middle" fill="#1F2937" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">Restorative</text>
        <text x="63" y="56" text-anchor="middle" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9">Implants &amp; Crowns</text>
      </g>

      <g transform="translate(272, 0)">
        <rect width="126" height="64" rx="12" fill="#F8FAF9" stroke="#E5E7EB"/>
        <text x="63" y="26" text-anchor="middle" font-size="16">🛡️</text>
        <text x="63" y="44" text-anchor="middle" fill="#1F2937" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">Zero Defect QA</text>
        <text x="63" y="56" text-anchor="middle" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9">ZiFlow Protocol</text>
      </g>
    </g>
  </g>

  <!-- Bottom Interactive Bar: QA & Technical Highlights -->
  <g transform="translate(60, 540)">
    <rect width="1080" height="160" rx="20" fill="#1B4D3E" filter="url(#shadow)"/>

    <g transform="translate(36, 32)">
      <text x="0" y="16" fill="#A7D7C5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="1">
        ENGINEERED BY KRISHNA PRAJAPAT • QA LEAD &amp; SENIOR WORDPRESS DEVELOPER
      </text>
      <text x="0" y="46" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Georgia', serif" font-size="22" font-weight="700">
        Enterprise WordPress Implementation &amp; Zero-Defect QA Delivery
      </text>
      <text x="0" y="74" fill="#D1E7DD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">
        Custom Elementor Pro &amp; ACF Pro Architecture • HIPAA Compliance • 100% Device Compatibility • Wordfence Hardened
      </text>
      <text x="0" y="98" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">
        Live Deployment: https://villagegreennb.wpenginepowered.com/
      </text>
    </g>

    <g transform="translate(860, 48)">
      <rect width="180" height="64" rx="14" fill="#2D6A4F" stroke="#52796F" stroke-width="1"/>
      <text x="90" y="28" text-anchor="middle" fill="#A7D7C5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" letter-spacing="1">ZIFLOW PROTOCOL</text>
      <text x="90" y="48" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800">ZERO DEFECTS</text>
    </g>
  </g>
</svg>
