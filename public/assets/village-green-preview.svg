        View All Services
      </text>
    </g>

    <!-- Trust Proof Metrics -->
    <g transform="translate(0, 305)">
      <circle cx="15" cy="15" r="14" fill="#FEF3C7"/>
      <text x="15" y="20" text-anchor="middle" font-size="14">⭐</text>
      <text x="36" y="14" fill="#1B4D3E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">4.9 / 5.0 Rating</text>
      <text x="36" y="28" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">500+ Verified Patient Reviews</text>

      <g transform="translate(230, 0)">
        <circle cx="15" cy="15" r="14" fill="#D1FAE5"/>
        <text x="15" y="20" text-anchor="middle" font-size="13">🛡️</text>
        <text x="36" y="14" fill="#1B4D3E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">Lifetime Warranty</text>
        <text x="36" y="28" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Smile Protection Program</text>
      </g>
    </g>
  </g>

  <!-- Right Column: Visual Showcase Card & Interactive Preview Elements -->
  <g transform="translate(680, 140)">
    <!-- Container Card -->
    <rect width="460" height="360" rx="24" fill="#FFFFFF" stroke="#C7D9D0" stroke-width="1.5" filter="url(#shadow)"/>

    <!-- Operatory / Patient Visual Illustration -->
    <rect x="16" y="16" width="428" height="230" rx="16" fill="#E2ECE6"/>
    
    <!-- Stylized Modern Clinic Backdrop -->
    <path d="M16 160 Q 150 110, 280 170 T 444 140 L 444 246 L 16 246 Z" fill="#C8DDD2" opacity="0.6"/>
    <circle cx="340" cy="90" r="45" fill="#B7D5C4" opacity="0.7"/>
    <circle cx="110" cy="110" r="30" fill="#A4CAB3" opacity="0.5"/>

    <!-- Dental Clinic Icon Graphic -->
    <g transform="translate(190, 80)">
